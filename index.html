<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comic Vault</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-deep: #000000;
            --glass-bg: rgba(30, 30, 30, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #ffffff;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }

        body { 
            background: var(--bg-deep); 
            color: var(--text-main); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
            height: 100vh;
        }

        /* Viewport */
        #viewer-container { width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; }
        
        #comic-page { 
            max-width: 100%; max-height: 100%; object-fit: contain; 
            transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1);
        }

        /* Glass Floating Navigation */
        .bottom-pill-nav {
            position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 12px 28px; border-radius: 40px;
            display: flex; gap: 24px; border: 1px solid var(--glass-border);
            z-index: 50; transition: opacity 0.3s;
        }

        .nav-btn { background: none; border: none; color: var(--text-main); font-weight: 600; font-size: 13px; }

        /* The Expansion Overlay (Material You Style) */
        #transition-overlay {
            position: fixed; inset: 0; background: var(--bg-deep);
            z-index: 100; transform: scale(0); border-radius: 50%;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        #transition-overlay.expand { transform: scale(3); border-radius: 0; }

        /* Shelf UI */
        .shelf-overlay {
            position: fixed; inset: 0; background: var(--bg-deep);
            z-index: 40; transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.2, 0, 0, 1);
            padding: 40px 20px;
        }
        .shelf-overlay.open { transform: translateY(0); }

        .shelf-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* Glass Cards */
        .comic-row-item {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 20px; border-radius: 24px;
            margin-bottom: 16px; border: 1px solid var(--glass-border);
            display: flex; align-items: center;
        }

        .add-btn {
            background: var(--accent); color: #000;
            padding: 16px; border-radius: 20px; text-align: center;
            font-weight: 700; margin-bottom: 20px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="transition-overlay"></div>

    <div id="viewer-container">
        <div id="left-zone" class="tap-zone" style="position:absolute; left:0; height:100%; width:25%; z-index:10;"></div>
        <div id="right-zone" class="tap-zone" style="position:absolute; right:0; height:100%; width:25%; z-index:10;"></div>
        <img id="comic-page" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><text x='50%' y='50%' fill='%23333' text-anchor='middle'>Add a comic</text></svg>">
    </div>

    <div class="bottom-pill-nav" id="main-nav">
        <button class="nav-btn" onclick="openShelf()">Library</button>
        <span id="page-indicator" style="font-size: 13px; font-weight: bold; opacity: 0.8;">0 / 0</span>
    </div>

    <div class="shelf-overlay" id="library-shelf">
        <div class="shelf-header">
            <h1 style="font-size: 28px;">Comic Vault</h1>
            <button class="nav-btn" onclick="closeShelf()">Close</button>
        </div>
        
        <label for="hidden-file-input" class="add-btn">Import Comics</label>
        <input type="file" id="hidden-file-input" accept=".cbz" multiple onchange="handleMultipleFiles(this)" style="display:none">
        
        <div id="comic-list" style="overflow-y:auto; height: 70vh;"></div>
    </div>

    <script>
        let currentComicData = { name: "", pages: [], currentIndex: 0 };
        let db = null;

        // DB Setup
        const dbRequest = indexedDB.open("ComicVaultSecureStorage", 1);
        dbRequest.onupgradeneeded = (e) => { e.target.result.createObjectStore("vault", { keyPath: "name" }); };
        dbRequest.onsuccess = (e) => { db = e.target.result; renderLibraryList(); };

        function openShelf() { document.getElementById('library-shelf').classList.add('open'); }
        function closeShelf() { document.getElementById('library-shelf').classList.remove('open'); }

        // Material You Style Transition
        function triggerExpansion(callback) {
            const overlay = document.getElementById('transition-overlay');
            overlay.classList.add('expand');
            setTimeout(() => {
                callback();
                overlay.classList.remove('expand');
            }, 500);
        }

                console.log("Loading " + filename);
                // After loading:
                renderPage();
            });
        }

    </script>
</body>
</html>
