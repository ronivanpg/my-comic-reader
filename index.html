<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comic Vault</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#071e26">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #071e26;
            --surface-color: #0f3c4c;
            --accent-color: #1a6985;
            --text-color: #e6f3f7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #viewer-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #comic-page {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-origin: center center;
        }

        .tap-zone {
            position: absolute;
            top: 0;
            height: 100%;
            width: 25%;
            z-index: 10;
        }
        #left-zone { left: 0; }
        #right-zone { right: 0; }

        #progress-timeline {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 5px;
            width: 0%;
            background: var(--accent-color);
            z-index: 15;
            transition: width 0.2s ease;
        }

        /* Bottom Navigation Pill */
        .bottom-pill-nav {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 60, 76, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 24px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(26, 105, 133, 0.2);
            z-index: 20;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .bottom-pill-nav.hidden {
            transform: translate(-50%, 100px);
            opacity: 0;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 50px;
            transition: background 0.2s;
        }

        .nav-btn:active {
            background: var(--accent-color);
        }

        /* Slide-up Library Shelf */
        .shelf-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: var(--surface-color);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            box-shadow: 0 -8px 32px rgba(0,0,0,0.4);
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
            z-index: 30;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .shelf-overlay.open {
            transform: translateY(0);
        }

        .shelf-handle {
            width: 40px;
            height: 5px;
            background: rgba(230, 243, 247, 0.3);
            border-radius: 10px;
            margin: 0 auto 16px auto;
            flex-shrink: 0;
        }

        .shelf-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        /* Folder Action Button */
        .folder-action-btn {
            background: var(--accent-color);
            color: var(--text-color);
            border: none;
            padding: 14px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            margin-bottom: 16px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .folder-action-btn:active {
            background: #258cb2;
        }

        /* Dynamic Comic List Container */
        .comic-list-container {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 20px;
        }

        .comic-row-item {
            background: var(--bg-color);
            padding: 16px;
            border-radius: 18px;
            border: 1px solid rgba(26, 105, 133, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .comic-row-item:active {
            background: rgba(26, 105, 133, 0.2);
        }

        .comic-row-title {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 85%;
        }

        .bookmark-badge {
            font-size: 11px;
            background: var(--surface-color);
            padding: 4px 8px;
            border-radius: 12px;
            opacity: 0.7;
        }

        .slide-in { animation: slideInEffect 0.25s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes slideInEffect {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div id="viewer-container">
        <div id="left-zone" class="tap-zone"></div>
        <div id="right-zone" class="tap-zone"></div>
        <img id="comic-page" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100%' height='100%' fill='%23071e26'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%231a6985' font-family='sans-serif' font-size='5'>Tap Library below to map folder</text></svg>" alt="Comic Page">
        <div id="progress-timeline"></div>
    </div>

    <div class="bottom-pill-nav" id="main-nav">
        <button class="nav-btn" onclick="toggleShelf(true)">Library</button>
        <span id="page-indicator" style="font-size: 13px; font-weight: bold; opacity: 0.8;">0 / 0</span>
        <button class="nav-btn" onclick="toggleNavVisibility()">Hide</button>
    </div>

    <div class="shelf-overlay" id="library-shelf">
        <div class="shelf-handle" onclick="toggleShelf(false)"></div>
        <div class="shelf-title" id="shelf-headline">Comic Vault</div>
        
        <button class="folder-action-btn" id="folder-ctrl" onclick="handleFolderAction()">Select Comic Folder</button>
        
        <div class="comic-list-container" id="comic-list">
            </div>
    </div>

    <script>
        let currentComicData = { name: "", pages: [], currentIndex: 0 };
        let comicFilesMap = {}; 
        let savedFolderHandle = null;
        let isZoomed = false;
        let lastTapTime = 0;
        let db = null;

        // Secure DB Setup to cache directory references
        const dbRequest = indexedDB.open("ComicVaultFolderStorage", 1);
        dbRequest.onupgradeneeded = (e) => {
            e.target.result.createObjectStore("settings");
        };
        dbRequest.onsuccess = (e) => {
            db = e.target.result;
            checkSavedFolder();
        };

        function toggleShelf(show) {
            document.getElementById('library-shelf').classList.toggle('open', show);
        }

        function toggleNavVisibility() {
            document.getElementById('main-nav').classList.add('hidden');
        }

        document.getElementById('viewer-container').addEventListener('click', (e) => {
            if(e.target.className !== 'tap-zone') {
                document.getElementById('main-nav').classList.remove('hidden');
            }
        });

        // Pull stored folder keys
        function checkSavedFolder() {
            const tx = db.transaction(["settings"], "readonly");
            const req = tx.objectStore("settings").get("dirHandle");
            req.onsuccess = () => {
                if (req.result) {
                    savedFolderHandle = req.result;
                    document.getElementById("folder-ctrl").innerText = "🔓 Tap to Unlock Folder";
                    document.getElementById("folder-ctrl").style.background = "#1a6985";
                }
            };
        }

        async function handleFolderAction() {
            if (savedFolderHandle) {
                const opts = { mode: 'read' };
                if (await savedFolderHandle.requestPermission(opts) === 'granted') {
                    scanDirectory(savedFolderHandle);
                }
            } else {
                try {
                    const handle = await window.showDirectoryPicker();
                    savedFolderHandle = handle;
                    
                    const tx = db.transaction(["settings"], "readwrite");
                    tx.objectStore("settings").put(handle, "dirHandle");
                    
                    scanDirectory(handle);
                } catch (err) {
                    console.log("Folder choosing cancelled");
                }
            }
        }

        async function scanDirectory(handle) {
            const listContainer = document.getElementById("comic-list");
            listContainer.innerHTML = ""; 
            comicFilesMap = {}; 

            document.getElementById("folder-ctrl").innerText = "🔄 Resync Folder";
            document.getElementById("folder-ctrl").style.background = "rgba(15, 60, 76, 0.6)";
            document.getElementById("shelf-headline").innerText = `Comic Vault (${handle.name})`;

            for await (const entry of handle.values()) {
                if (entry.kind === 'file' && /\.(cbz)$/i.test(entry.name)) {
                    comicFilesMap[entry.name] = entry;
                    
                    const savedPage = localStorage.getItem(`bookmark_${entry.name}`);
                    const progressText = savedPage ? `p. ${parseInt(savedPage, 10) + 1}` : 'Unread';

                    const row = document.createElement("div");
                    row.className = "comic-row-item";
                    row.onclick = () => loadComicFile(entry.name);
                    row.innerHTML = `
                        <span class="comic-row-title">${entry.name}</span>
                        <span class="bookmark-badge" id="badge-${btoa(entry.name).replace(/=/g, '')}">${progressText}</span>
                    `;
                    listContainer.appendChild(row);
                }
            }
            
            if (Object.keys(comicFilesMap).length === 0) {
                listContainer.innerHTML = `<div style="text-align:center; opacity:0.5; margin-top:30px;">No .cbz files found in this folder.</div>`;
            }
        }

        async function loadComicFile(filename) {
            const entry = comicFilesMap[filename];
            if (!entry) return;

            toggleShelf(false);
            currentComicData.name = filename;
            currentComicData.pages = [];

            try {
                const file = await entry.getFile();
                const zip = await JSZip.loadAsync(file);
                const fileEntries = [];

                zip.forEach((relativePath, zipEntry) => {
                    if (!zipEntry.dir && /\.(jfif|jpeg|jpg|png|webp)$/i.test(relativePath)) {
                        fileEntries.push(zipEntry);
                    }
                });

                fileEntries.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));

                for (let imgEntry of fileEntries) {
                    const blob = await imgEntry.async("blob");
                    currentComicData.pages.push(URL.createObjectURL(blob));
                }

                const savedPage = localStorage.getItem(`bookmark_${filename}`);
                currentComicData.currentIndex = savedPage ? parseInt(savedPage, 10) : 0;

                renderPage();
            } catch (err) {
                alert("Error unpacking comic layout: " + err.message);
            }
        }

        function renderPage() {
            if (currentComicData.pages.length === 0) return;
            const img = document.getElementById('comic-page');
            
            img.classList.remove('slide-in');
            img.src = currentComicData.pages[currentComicData.currentIndex];
            img.classList.add('slide-in');

            const totalPages = currentComicData.pages.length;
            const currentNumber = currentComicData.currentIndex + 1;
            document.getElementById('page-indicator').innerText = `${currentNumber} / ${totalPages}`;
            
            const progressPercent = (currentNumber / totalPages) * 100;
            document.getElementById('progress-timeline').style.width = `${progressPercent}%`;

            localStorage.setItem(`bookmark_${currentComicData.name}`, currentComicData.currentIndex);
            
            const safeId = btoa(currentComicData.name).replace(/=/g, '');
            const badge = document.getElementById(`badge-${safeId}`);
            if(badge) badge.innerText = `p. ${currentNumber}`;
        }

        // Stepper Controls
        document.getElementById('right-zone').addEventListener('click', () => {
            if (currentComicData.currentIndex < currentComicData.pages.length - 1) {
                currentComicData.currentIndex++;
                renderPage();
            }
        });

        document.getElementById('left-zone').addEventListener('click', () => {
            if (currentComicData.currentIndex > 0) {
                currentComicData.currentIndex--;
                renderPage();
            }
        });

        // Double Tap Zoom Engine
        document.getElementById('viewer-container').addEventListener('click', (e) => {
            if(e.target.id === 'comic-page') {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;
                if (tapLength < 300 && tapLength > 0) {
                    const img = document.getElementById('comic-page');
                    img.style.transform = !isZoomed ? 'scale(2)' : 'scale(1)';
                    isZoomed = !isZoomed;
                    e.preventDefault();
                }
                lastTapTime = currentTime;
            }
        });
    </script>
</body>
</html>
